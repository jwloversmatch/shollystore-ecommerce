      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="164" y1="116" x2="348" y2="356" gradientUnits="userSpaceOnUse">
