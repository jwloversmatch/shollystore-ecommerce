<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Drop shadow -->
  <ellipse cx="50" cy="88" rx="30" ry="8" fill="rgba(0,0,0,0.2)" />
  
  <!-- 3D Cube - Bottom face (depth) -->
  <rect x="20" y="30" width="60" height="40" rx="10" fill="#3B1F82" />
  
  <!-- 3D Cube - Top face (tilted) -->
  <polygon points="20,30 50,15 80,30 50,45" fill="#0A192F" />
  
  <!-- 3D Cube - Front face (main) -->
  <rect x="20" y="30" width="60" height="50" rx="10" fill="url(#gradMain)" />
  
  <!-- Gradient for front face -->
  <defs>
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3CE1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A1B9A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Glossy reflection (diagonal shine) -->
  <polygon points="20,30 50,30 30,80 20,80" fill="rgba(255,255,255,0.15)" />
  <polygon points="50,30 55,30 40,80 35,80" fill="rgba(255,255,255,0.08)" />
  
  <!-- Bold 'S' on front face (embossed look) -->
  <text x="50" y="65" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#goldS)" text-anchor="middle" letter-spacing="-2">S</text>
  
  <!-- Subtle highlight on 'S' for 3D effect -->
  <text x="48" y="63" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="-2">S</text>
  
  <!-- Bevel edge highlight (top-left) -->
  <path d="M 30,30 L 20,30 L 20,40" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>