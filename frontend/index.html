<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Basic SEO -->
    <title>SholexStore – Your One‑Stop Shop for Quality Products</title>
    <meta name="description" content="Shop the best deals on fashion, beverages, electronics and more. Fast delivery across Nigeria." />
    <meta name="keywords" content="fashion, beverages, electronics, online store, Nigeria, fast delivery" />
    <meta name="author" content="SholexStore" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://iresstore.vercel.app" />

    <!-- Open Graph (Facebook, WhatsApp, etc.) -->
    <meta property="og:title" content="SholexStore – Your One‑Stop Shop for Quality Products" />
    <meta property="og:description" content="Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably." />
    <meta property="og:image" content="/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SholexStore – Quality Products" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SholexStore" />
    <meta property="og:url" content="https://iresstore.vercel.app" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SholexStore – Your One‑Stop Shop for Quality Products" />
    <meta name="twitter:description" content="Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably." />
    <meta name="twitter:image" content="/og-default.jpg" />
    <meta name="twitter:image:alt" content="SholexStore – Quality Products" />
    <meta name="twitter:site" content="@sholexstore" />
    <meta name="twitter:creator" content="@sholexstore" />

    <!-- Geo tags -->
    <meta name="geo.region" content="NG" />
    <meta name="geo.placename" content="Nigeria" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SholexStore",
        "url": "https://iresstore.vercel.app",
        "logo": "https://iresstore.vercel.app/logo.png",
        "description": "Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably.",
        "sameAs": [
          "https://twitter.com/sholexstore",
          "https://instagram.com/sholexstore"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-000-000-0000",
          "contactType": "customer service",
          "areaServed": "NG",
          "availableLanguage": ["English"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
