<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />

    <!-- DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://sholex.vercel.app" />
    <link rel="preconnect" href="https://sholex.vercel.app" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/sholex.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/sholex-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/sholex-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/sholex-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/sholex-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/sholex-512.png" />

    <!-- Preload Critical Assets -->
    <link
      rel="preload"
      href="/fonts/inter-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sholex" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Basic SEO -->
    <title>Sholex – Your One‑Stop Shop for Quality Products</title>
    <meta
      name="description"
      content="Shop the best deals on fashion, beverages, electronics and more. Fast delivery across Nigeria."
    />
    <meta
      name="keywords"
      content="fashion, beverages, electronics, online store, Nigeria, fast delivery, shopping, Sholex"
    />
    <meta name="author" content="Sholex" />
    <meta name="rating" content="General" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://sholex.vercel.app" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Sholex – Your One‑Stop Shop for Quality Products"
    />
    <meta
      property="og:description"
      content="Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably."
    />
    <meta
      property="og:image"
      content="https://sholex.vercel.app/og-image.jpeg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sholex – Quality Products" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sholex" />
    <meta property="og:url" content="https://sholex.vercel.app" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sholex – Your One‑Stop Shop for Quality Products"
    />
    <meta
      name="twitter:description"
      content="Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably."
    />
    <meta
      name="twitter:image"
      content="https://sholex.vercel.app/og-image.jpeg"
    />
    <meta name="twitter:image:alt" content="Sholex – Quality Products" />
    <meta name="twitter:site" content="@sholexstore" />
    <meta name="twitter:creator" content="@sholexstore" />

    <!-- Geo tags -->
    <meta name="geo.region" content="NG" />
    <meta name="geo.placename" content="Nigeria" />

    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sholex",
        "url": "https://sholex.vercel.app",
        "logo": "https://sholex.vercel.app/logo.png",
        "image": "https://sholex.vercel.app/og-image.jpeg",
        "description": "Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably.",
        "sameAs": [
          "https://twitter.com/sholexstore",
          "https://instagram.com/sholexstore"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-000-000-0000",
          "contactType": "customer service",
          "areaServed": "NG",
          "availableLanguage": ["English"]
        }
      }
    </script>

    <!-- Structured Data – WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sholex",
        "url": "https://sholex.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sholex.vercel.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Inline Critical CSS -->
    <style>
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #0a0a0b;
        color: #fff;
      }
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
