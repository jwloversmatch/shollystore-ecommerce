<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    
    <!-- DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://iresstore.vercel.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://iresstore.vercel.app" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Preload Critical Assets -->
    <link rel="preload" href="/favicon.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/og-default.jpg" as="image" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e8622a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sholly" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Basic SEO -->
    <title>SholexStore – Your One‑Stop Shop for Quality Products</title>
    <meta name="description" content="Shop the best deals on fashion, beverages, electronics and more. Fast delivery across Nigeria." />
    <meta name="keywords" content="fashion, beverages, electronics, online store, Nigeria, fast delivery, shopping, SholexStore" />
    <meta name="author" content="SholexStore" />
    <meta name="rating" content="General" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://iresstore.vercel.app" />

    <!-- Open Graph (Facebook, WhatsApp, etc.) -->
    <meta property="og:title" content="SholexStore – Your One‑Stop Shop for Quality Products" />
    <meta property="og:description" content="Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably." />
    <meta property="og:image" content="https://iresstore.vercel.app/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SholexStore – Quality Products" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SholexStore" />
    <meta property="og:url" content="https://iresstore.vercel.app" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SholexStore – Your One‑Stop Shop for Quality Products" />
    <meta name="twitter:description" content="Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably." />
    <meta name="twitter:image" content="https://iresstore.vercel.app/og-default.jpg" />
    <meta name="twitter:image:alt" content="SholexStore – Quality Products" />
    <meta name="twitter:site" content="@sholexstore" />
    <meta name="twitter:creator" content="@sholexstore" />

    <!-- Geo tags -->
    <meta name="geo.region" content="NG" />
    <meta name="geo.placename" content="Nigeria" />

    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SholexStore",
        "url": "https://iresstore.vercel.app",
        "logo": "https://iresstore.vercel.app/logo.png",
        "description": "Quality products at unbeatable prices – from fashion to beverages, delivered fast and reliably.",
        "sameAs": [
          "https://twitter.com/sholexstore",
          "https://instagram.com/sholexstore"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-000-000-0000",
          "contactType": "customer service",
          "areaServed": "NG",
          "availableLanguage": ["English"]
        }
      }
    </script>

    <!-- Structured Data – WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SholexStore",
        "url": "https://iresstore.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://iresstore.vercel.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Inline Critical CSS to prevent render blocking -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html{font-size:16px;-webkit-text-size-adjust:100%}
      body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0A0A0B;color:#fff;min-height:100vh;overflow-x:hidden}
      #root{min-height:100vh}
      @media (prefers-reduced-motion: no-preference) {
        :root{scroll-behavior:smooth}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
